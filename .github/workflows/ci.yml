name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check server syntax
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Upload build artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
